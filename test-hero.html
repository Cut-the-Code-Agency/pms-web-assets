<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromite hero-modus test</title>
<style>
  body { margin: 0; background: #f0f0f0; color: #111; font-family: system-ui, sans-serif; }
  main { display: flex; flex-direction: column; }
  section { position: relative; min-height: 100vh; background: #f0f0f0; }
  .blend { position: relative; z-index: 2; color: #fff; mix-blend-mode: difference; }
  .hero_inner { min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 2rem 3rem; box-sizing: border-box; }
  .title { font-size: 8.4vw; font-weight: 800; line-height: 1; margin: 30vh 0 0; white-space: nowrap; text-align: center; }
  .text { max-width: 36rem; margin-left: auto; font-size: 1.25rem; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid currentColor; }
  .stats div { border-left: 1px solid currentColor; padding: 1rem; } .stats div:first-child { border-left: 0; }
  .imgs { display: flex; gap: 4rem; padding: 4rem 3rem; position: relative; z-index: 0; }
  .imgs div { flex: 1; height: 14rem; background: #d9d9d9; }
</style>
</head>
<body>
<main>
  <div class="chromite_wrap" data-chromite data-chromite-mode="hero"></div>
  <section><div class="blend"><div class="hero_inner">
    <h1 class="title">PLOMP MINERAL SERVICES</h1>
    <p class="text">Testtekst: kijk hoe deze tekst van kleur wisselt waar de steen eronder draait.</p>
    <div class="stats"><div><b>30%</b><br>Testcijfer</div><div><b>30%</b><br>Testcijfer</div><div><b>30%</b><br>Testcijfer</div><div><b>30%</b><br>Testcijfer</div></div>
  </div></div></section>
  <section><div class="blend" style="padding:3rem"><h2>Volgende sectie</h2></div><div class="imgs"><div></div><div></div><div></div></div></section>
  <section style="background:#ddd"><div style="padding:3rem"><h2>Daarna: steen is weg</h2></div></section>
</main>
<script type="module" src="dist/chromite.js"></script>
</body>
</html>
