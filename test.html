<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromite hero-test</title>
<style>
  body { margin: 0; background: #0e0e0e; color: #f2f2f2; font-family: system-ui, sans-serif; }
  .hero { height: 200vh; }
  .hero_sticky { position: sticky; top: 0; height: 100vh; display: grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 0 6vw; }
  .chromite_wrap { height: 80vh; }
  .chromite_wrap img { width: 100%; height: 100%; object-fit: contain; }
  .after { height: 100vh; padding: 6vw; }
</style>
</head>
<body>
  <!-- Nabootsing van de Webflow-markup: lokaal openen via een server (npx serve .) -->
  <section class="hero">
    <div class="hero_sticky">
      <h1>Home hero</h1>
      <div class="chromite_wrap" data-chromite></div>
    </div>
  </section>
  <section class="after"><h2>Volgende sectie</h2></section>
  <script type="module" src="dist/chromite.js"></script>
</body>
</html>
